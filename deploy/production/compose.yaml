# Production deployment, separate from deploy/docker-local and its lab data.
# Run from the repository root after preparing the remaining deployment files:
#   docker compose --env-file /etc/hams/compose.env \
#     -f deploy/production/compose.yaml ...
# Requires Docker Compose >= 2.30 for raw service env files.
#
# Public origin: https://med.hss05.com:20443
# Server HTTPS listener: HAMS_BIND_IP:443 -> container port 8443.
# Upstream NAT/proxy routing from external 20443 to server 443 is managed by IT.
# The application origin must retain :20443 even though the server uses 443.
#
# /etc/hams is an example HAMS_CONFIG_DIR, outside the source checkout:
#   compose.env       HAMS_RELEASE, HAMS_CONFIG_DIR, HAMS_BIND_IP (no app secrets)
#   backend.env       Database URL, auth keys and the real ADMIN identities
#   smtp.env          SMTP provider settings and credentials
#   postgres-password Same database password used in backend.env DATABASE_URL
#   tls/              fullchain.pem and privkey.pem for med.hss05.com
# Raw env files use literal KEY=value lines; do not wrap values in quotes.
# Never copy the VM lab's auth keys, test ADMIN identities or test CA here.
#
# Initial installation and each update require explicit, reviewed migration
# commands via the setup service. Startup never migrates, seeds or bootstraps.
# Only reference data is seeded for a new install; no demo data is imported.
# Back up database, images and configuration/keys together before updating.
# Never run `down --volumes` against production data.
name: hams

x-logging: &hams-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hams-env-files: &hams-env-files
  - path: ${HAMS_CONFIG_DIR:?Set HAMS_CONFIG_DIR to the configuration directory}/backend.env
    required: true
    format: raw
  - path: ${HAMS_CONFIG_DIR:?Set HAMS_CONFIG_DIR to the configuration directory}/smtp.env
    required: true
    format: raw

x-hams-environment: &hams-environment
  NODE_ENV: production
  PORT: "3000"
  HAMS_INSTALLATION_MODE: customer
  GEMINI_ENABLED: "false"
  GEMINI_API_KEY: ""
  BETTER_AUTH_URL: https://med.hss05.com:20443
  FRONTEND_URL: https://med.hss05.com:20443
  VERCEL_PREVIEW_ORIGIN_PATTERN: ""
  AUTH_DB_DIAGNOSTICS: "0"
  IMAGE_STORAGE_PROVIDER: local
  IMAGE_STORAGE_ROOT: /var/lib/hams/images
  IMAGE_STORAGE_TEMP_ROOT: /var/lib/hams/image-temp

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: hams_prod
      POSTGRES_USER: hams_prod
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    stop_grace_period: 60s
    logging: *hams-logging

  backend:
    image: hams-backend:${HAMS_RELEASE:?Set HAMS_RELEASE to the release revision}
    pull_policy: never
    build:
      context: ../..
      dockerfile: Dockerfile.backend
      target: runtime
    init: true
    restart: unless-stopped
    env_file: *hams-env-files
    environment: *hams-environment
    volumes:
      # New named volumes inherit UID/GID 1000 and mode 0700 from the image.
      # Existing volumes must retain matching ownership when restored.
      - images:/var/lib/hams/images
      - image-temp:/var/lib/hams/image-temp
    networks:
      - private
      - smtp-egress
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    logging: *hams-logging

  frontend:
    image: hams-frontend:${HAMS_RELEASE:?Set HAMS_RELEASE to the release revision}
    pull_policy: never
    build:
      context: ../..
      dockerfile: Dockerfile.frontend
      target: runtime
    init: true
    restart: unless-stopped
    ports:
      - name: https
        target: 8443
        published: "443"
        host_ip: ${HAMS_BIND_IP:?Set HAMS_BIND_IP to the server listening IPv4 address}
        protocol: tcp
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HAMS_CONFIG_DIR:?Set HAMS_CONFIG_DIR to the configuration directory}/tls
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
    networks:
      - private
      - edge
    depends_on:
      backend:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    logging: *hams-logging

  # Opt-in administration image; absent from an ordinary `compose up`.
  # Uses the same public URL, database settings and real SMTP as the backend.
  # Bootstrap sends credentials/verification mail to the configured real ADMINS.
  setup:
    profiles: [tools]
    image: hams-backend-setup:${HAMS_RELEASE:?Set HAMS_RELEASE to the release revision}
    pull_policy: never
    build:
      context: ../..
      dockerfile: Dockerfile.backend
      target: setup
    init: true
    restart: "no"
    env_file: *hams-env-files
    environment: *hams-environment
    networks:
      - private
      - smtp-egress
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *hams-logging

networks:
  private:
    internal: true
  edge:
  # Provides external routing for the configured SMTP provider. This is not
  # a host/port allowlist; the server firewall policy controls outbound access.
  smtp-egress:

# Names are scoped to hams, separate from the VM's hams-deploy-lab project.
volumes:
  postgres-data:
  images:
  image-temp:

secrets:
  postgres_password:
    file: ${HAMS_CONFIG_DIR:?Set HAMS_CONFIG_DIR to the configuration directory}/postgres-password
