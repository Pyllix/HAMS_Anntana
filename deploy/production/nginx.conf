# Loaded inside the frontend image's existing http block, not as nginx.conf.
# Compose publishes server port 443 to this container's HTTP listener 8081.
# Public entry point: http://med.hss05.com:20443
#
# This configuration serves plain HTTP by customer request. TCP forwarding must
# preserve the browser's Host header, including :20443. If IT supplies another
# reverse proxy, confirm its protocol/Host behavior before deploying this file.
# No web certificate is mounted. Outbound SMTP TLS is configured separately.

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream hams_backend {
    zone hams_backend 64k;
    server backend:3000 resolve;
    keepalive 16;
}

# Only the agreed public origin serves the app. Requests to the same hostname
# without the external port redirect to that origin before reaching the API.
map $http_host $hams_canonical_authority {
    default 0;
    ~*^med\.hss05\.com:20443$ 1;
}

# Keep query-string verification tokens and Referer URLs out of access logs.
# Error logs still require restricted access and an agreed retention policy.
log_format hams '$remote_addr [$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent $request_time';
server_tokens off;

# The image healthcheck uses this loopback-only plaintext listener.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    access_log off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / { return 404; }
}

# Unknown Host values must not serve this application.
server {
    listen 8081 default_server;
    server_name _;
    access_log /var/log/nginx/access.log hams;
    return 444;
}

server {
    listen 8081;
    server_name med.hss05.com;
    # Override the image's inherited combined log, which includes query tokens.
    access_log /var/log/nginx/access.log hams;

    if ($hams_canonical_authority = 0) {
        return 308 http://med.hss05.com:20443$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    # Path-only redirects retain the browser's external port, never 8081/443.
    absolute_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Host med.hss05.com:20443;
    proxy_set_header X-Forwarded-Host med.hss05.com:20443;
    proxy_set_header X-Forwarded-Port 20443;
    proxy_set_header X-Forwarded-Proto http;
    # Do not trust caller-supplied forwarding headers. An upstream reverse proxy
    # needs separately reviewed trusted addresses before enabling real-IP trust.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_next_upstream off;
    proxy_redirect off;

    # Better Auth's verification endpoint includes /api; preserve that prefix.
    location = /api/auth/verify-email {
        proxy_pass http://hams_backend;
    }

    location = /api/notifications/stream {
        proxy_pass http://hams_backend/notifications/stream;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        gzip off;
    }

    # Other browser API calls drop /api before reaching the Nest controllers.
    location ^~ /api/ {
        proxy_pass http://hams_backend/;
    }

    location = /api {
        return 308 /api/$is_args$args;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }
}
