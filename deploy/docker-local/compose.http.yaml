# HTTP rehearsal on our own VM only. Layer AFTER compose.yaml and any existing
# .runtime/compose.smtp.yaml override. Do not use with deploy/production.
# Requires the backend HTTP opt-in code and Docker Compose >= 2.30.
# Keep the existing project name and volumes; this switches the same lab to HTTP.
services:
  backend:
    environment:
      HAMS_ALLOW_INSECURE_HTTP: "true"
      BETTER_AUTH_URL: http://localhost:21743
      FRONTEND_URL: http://localhost:21743

  setup:
    environment:
      HAMS_ALLOW_INSECURE_HTTP: "true"
      BETTER_AUTH_URL: http://localhost:21743
      FRONTEND_URL: http://localhost:21743

  frontend:
    # Replace, rather than append to, the HTTPS port and TLS mounts.
    ports: !override
      - "127.0.0.1:21743:8081"
    volumes: !override
      - type: bind
        source: ./nginx.http.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false

# The backend/setup/Mailpit TLS mounts remain: SMTP still requires STARTTLS.
