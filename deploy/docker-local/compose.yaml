# Local deployment rehearsal only. Run from the repository root with:
#   docker compose -f deploy/docker-local/compose.yaml ...
# Requires Docker Compose >= 2.30 (raw env_file support).
#
# Preparation is a separate, explicit step before the first `up`:
# - Generate .runtime/backend.env and .runtime/postgres-password together.
#   DATABASE_URL must use postgres:5432 / hams_lab and the same password.
# - Populate the project-scoped tls volume with ca.crt, fullchain.pem and
#   privkey.pem. The certificate must cover localhost and smtp (SAN).
#   Use root:101 ownership, key mode 0640, public certificates mode 0644,
#   and directory mode 0755. Never disable TLS verification.
# - Build images; start postgres and smtp; explicitly run migrations,
#   reference seed and ADMIN bootstrap using the `setup` service.
# - Then start backend and frontend. Ordinary startup does not migrate/seed.
#
# No customer credentials or existing host .env files are loaded here.
# The .runtime directory is ignored by Git and the Docker build context.
# Do not use `down --volumes` unless intentionally deleting this lab's data.
name: hams-deploy-lab

x-logging: &lab-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hams-environment: &hams-environment
  NODE_ENV: production
  PORT: "3000"
  HAMS_INSTALLATION_MODE: customer
  GEMINI_ENABLED: "false"
  BETTER_AUTH_URL: https://localhost:20443
  FRONTEND_URL: https://localhost:20443
  IMAGE_STORAGE_PROVIDER: local
  IMAGE_STORAGE_ROOT: /var/lib/hams/images
  IMAGE_STORAGE_TEMP_ROOT: /var/lib/hams/image-temp
  SMTP_HOST: smtp
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
  SMTP_REQUIRE_TLS: "true"
  SMTP_USER: ""
  SMTP_PASS: ""
  SMTP_FROM: HAMS Lab <noreply@hams.test>
  NODE_EXTRA_CA_CERTS: /etc/hams/tls/ca.crt

x-hams-env-file: &hams-env-file
  - path: ./.runtime/backend.env
    required: true
    format: raw

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: hams_lab
      POSTGRES_USER: hams_lab
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    logging: *lab-logging

  # Captures test mail locally; no SMTP relay/forwarding is configured.
  # Messages use temporary storage and are lost when this container stops.
  smtp:
    image: axllent/mailpit:v1.31.6
    user: "1000:101"
    restart: unless-stopped
    environment:
      MP_SMTP_TLS_CERT: /tls/fullchain.pem
      MP_SMTP_TLS_KEY: /tls/privkey.pem
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_DISABLE_RDNS: "true"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_LABEL: HAMS local deployment lab
    ports:
      - "127.0.0.1:18025:8025"
    volumes:
      - type: volume
        source: tls
        target: /tls
        read_only: true
        volume:
          nocopy: true
    networks:
      - private
      - edge
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *lab-logging

  backend:
    image: hams-backend:docker-local
    build:
      context: ../..
      dockerfile: Dockerfile.backend
      target: runtime
    init: true
    restart: unless-stopped
    env_file: *hams-env-file
    environment: *hams-environment
    volumes:
      # New image volumes inherit UID/GID 1000 from Dockerfile.backend.
      - images:/var/lib/hams/images
      - image-temp:/var/lib/hams/image-temp
      - type: volume
        source: tls
        target: /etc/hams/tls
        read_only: true
        volume:
          nocopy: true
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
      smtp:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *lab-logging

  frontend:
    image: hams-frontend:docker-local
    build:
      context: ../..
      dockerfile: Dockerfile.frontend
      target: runtime
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:20443:8443"
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: tls
        target: /etc/nginx/tls
        read_only: true
        volume:
          nocopy: true
    networks:
      - private
      - edge
    depends_on:
      backend:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *lab-logging

  # Opt-in administration tools, never part of a normal `compose up`.
  # Examples (after preparing secrets/TLS and starting postgres + smtp):
  #   ... run --rm setup pnpm exec prisma migrate deploy
  #   ... run --rm setup pnpm run prisma:seed:reference
  #   ... run --rm setup pnpm run prisma:bootstrap-admins
  setup:
    profiles: [tools]
    image: hams-backend-setup:docker-local
    build:
      context: ../..
      dockerfile: Dockerfile.backend
      target: setup
    init: true
    restart: "no"
    env_file: *hams-env-file
    environment: *hams-environment
    volumes:
      - type: volume
        source: tls
        target: /etc/hams/tls
        read_only: true
        volume:
          nocopy: true
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
      smtp:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *lab-logging

networks:
  # Backend and database have no route to external services in this lab.
  private:
    internal: true
  edge:

# Compose scopes these volumes by project; no existing DB or storage is used.
volumes:
  postgres-data:
  images:
  image-temp:
  tls:

secrets:
  postgres_password:
    file: ./.runtime/postgres-password
