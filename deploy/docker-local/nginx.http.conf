# HTTP-only frontend configuration for our VM rehearsal, not production.
# Loaded inside the image's http block by compose.http.yaml.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream hams_backend {
    zone hams_backend 64k;
    server backend:3000 resolve;
    keepalive 16;
}

map $http_host $hams_external_port {
    default 80;
    ~:(?<hams_explicit_port>[0-9]+)$ $hams_explicit_port;
}

# Do not put verification tokens or Referer URLs into access logs.
log_format hams_http '$remote_addr [$time_local] '
                     '"$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time';

# Preserve the image's loopback healthcheck independently of the app listener.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    server_tokens off;
    access_log off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / { return 404; }
}

server {
    listen 8081;
    server_name localhost;
    server_tokens off;
    access_log /var/log/nginx/access.log hams_http;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;
    absolute_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $hams_external_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_next_upstream off;
    proxy_redirect off;

    location = /api/auth/verify-email {
        proxy_pass http://hams_backend;
    }

    location = /api/notifications/stream {
        proxy_pass http://hams_backend/notifications/stream;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        gzip off;
    }

    location ^~ /api/ {
        proxy_pass http://hams_backend/;
    }

    location = /api {
        return 308 /api/$is_args$args;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }
}
