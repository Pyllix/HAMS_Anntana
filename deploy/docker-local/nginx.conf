# Mount read-only at /etc/nginx/conf.d/default.conf in the frontend container.
# Mount the TLS certificate and key under /etc/nginx/tls at runtime.
# This file belongs inside the image's existing http block, not at nginx.conf.

# Docker's embedded DNS follows backend container IP changes without a reload.
# Dynamic upstream resolution requires Nginx >= 1.27.3 (the image pins 1.30.6).
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream hams_backend {
    zone hams_backend 64k;
    server backend:3000 resolve;
    keepalive 16;
}

# Preserve the external HTTPS port, rather than forwarding container port 8443.
map $http_host $hams_external_port {
    default 443;
    ~:(?<hams_explicit_port>[0-9]+)$ $hams_explicit_port;
}

# Only the container's own healthcheck can reach this plaintext listener.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    server_tokens off;
    access_log off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / { return 404; }
}

server {
    listen 8443 ssl;
    server_name localhost;
    server_tokens off;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HAMS_TLS:10m;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    # Relative redirects retain the browser's hostname and mapped port 20443.
    absolute_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $hams_external_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_next_upstream off;
    proxy_redirect off;

    # Better Auth creates verification links with /api/auth; retain that path.
    location = /api/auth/verify-email {
        proxy_pass http://hams_backend;
    }

    # Deliver notification events immediately, including after reconnection.
    location = /api/notifications/stream {
        proxy_pass http://hams_backend/notifications/stream;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        gzip off;
    }

    # Browser /api/auth/session -> Nest /auth/session (and likewise for images).
    location ^~ /api/ {
        proxy_pass http://hams_backend/;
    }

    location = /api {
        return 308 /api/$is_args$args;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }
}
